---
name: Deploy Website

"on":
  push:
    branches:
      - main
    paths:
      - "docs/site/**"
      - "docs/docusaurus/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-trigger:
    name: Check Deploy Trigger
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check commit type
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s)
          # Only deploy for chore/docs/style commits — fix/feat go through release pipeline
          if echo "$COMMIT_MSG" | grep -qE "^(chore|docs|style|build|ci|refactor):"; then
            echo "Website-only commit detected — deploying"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release commit (fix/feat) — skipping, release pipeline handles deploy"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  link-check:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-trigger
    if: needs.check-trigger.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # docs/docusaurus is not git-crypt encrypted, so no unlock is needed here.
      # External-URL flakiness is mitigated via retries + the repo-root .lycheeignore.
      #
      # Scope: external http(s) links only. Internal links are Docusaurus's job --
      # it builds with `onBrokenLinks: "throw"`, so it validates its own routes with
      # full knowledge of them. lychee cannot: it resolves `/docs/workflows/spec` to a
      # path on disk and never finds it, because the file is `.../spec.md` and lychee
      # does not append extensions. `--root-dir` lets it build those URLs instead of
      # erroring, and `--scheme` then drops the resulting file:// links unchecked.
      #
      # 403/429 are accepted on top of lychee's default range. News and media hosts
      # cited in the blog refuse datacenter clients outright (axios, venturebeat), so
      # those codes mean "this host won't talk to CI", not "this link is broken".
      # 404 stays a failure -- that is what catches genuinely dead links.
      #
      # `--` is required: `--scheme` and `--accept` take multiple values and would
      # otherwise swallow the inputs that follow them.
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: "--no-progress --max-retries 3 --retry-wait-time 2 --root-dir ${{ github.workspace }} --scheme http --scheme https --accept 100..=103,200..=299,403,429 -- docs/docusaurus/docs docs/docusaurus/blog README.md"
          fail: true

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-trigger, link-check]
    if: needs.check-trigger.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_jAsHrk71vRyWK6bCTYGJyp0q
          VERCEL_PROJECT_ID: prj_TXccrJI83HyNvQUZxqStUFgus9NB
        run: |
          DEPLOY_URL=$(vercel deploy --token="$VERCEL_TOKEN" --prod)
          echo "Deployed to: $DEPLOY_URL"
