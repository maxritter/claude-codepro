# Pilot Shell upstream manifest.
#
# Single source of truth for every upstream the installer touches. Each entry
# pins exact version + sha256 (or commit) + last-audited date.
# CI gates merges on this file via .github/workflows/supply-chain.yml
# (drift checker + manifest schema validation).
#
# Schema: installer/manifest.py:UpstreamEntry
# Audit log: `git log -p installer/upstreams.yaml`

version: 1
entries:
  - id: claude-display-patch
    name: "patch-claude-code source (native display details)"
    source_type: curl
    source_url: https://github.com/a-connoisseur/patch-claude-code/archive/27ef91e5d7fdeeec52dba727f2d2796b5b0fcdb3.tar.gz
    version: "commit-27ef91e"
    commit: "27ef91e5d7fdeeec52dba727f2d2796b5b0fcdb3"
    sha256: "9b5373a5b82e0b7fff161524ac15f2cf70c2fe6a6292a167664f151e803c414f"
    # Build from reviewed source against the user's native Claude; never run
    # upstream installers or download a prepatched Claude. Its frozen bun.lock
    # pins node-lief 1.1.1; all dependency lifecycle scripts stay disabled.
    last_audited: "2026-09-07"

  - id: nvm-curl
    name: nvm install.sh (v0.40.7)
    source_type: curl
    source_url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.7/install.sh
    version: v0.40.7
    sha256: "066ce4eaf4d78eaa6410433bc9ba58faaba646157cbbed6109153e6c24c5f8a5"
    last_audited: "2026-09-04"

  # ---- npm globals (Task 2) ----

  - id: codegraph
    name: "@colbymchenry/codegraph"
    source_type: npm
    source_url: "@colbymchenry/codegraph"
    version: "1.6.0"
    # MIT; public source at https://github.com/colbymchenry/codegraph. Since
    # 0.8 the platform package bundles Node and SQLite, so there is no native
    # compilation step and no external better-sqlite3 runtime dependency.
    last_audited: "2026-09-04"

  - id: vtsls
    name: "@vtsls/language-server"
    source_type: npm
    source_url: "@vtsls/language-server"
    version: "0.3.0"
    last_audited: "2026-09-04"

  - id: typescript
    name: typescript
    source_type: npm
    source_url: typescript
    version: "6.0.3"
    # 7.0.2 remains held: its real Console typecheck fails on Bun globals,
    # side-effect CSS imports, and newer library typing requirements.
    last_audited: "2026-09-04"

  - id: prettier
    name: prettier
    source_type: npm
    source_url: prettier
    version: "3.9.6"
    last_audited: "2026-09-04"

  - id: fast-check
    name: fast-check
    source_type: npm
    source_url: fast-check
    version: "4.9.0"
    last_audited: "2026-09-04"

  - id: impeccable
    name: "Impeccable CLI and design detector"
    source_type: npm
    source_url: impeccable
    version: "3.6.1"
    # Apache-2.0. The CLI installs the separately pinned skill bundle and runs
    # the deterministic design detector (no LLM or API key for detection).
    # Optional puppeteer dep (URL scanning) is skipped by the default
    # --ignore-scripts policy, so the install stays light (no Chromium download).
    # node-compat: engines >=22.18.0; install verified on Node 22.20.0.
    last_audited: "2026-09-04"

  - id: impeccable-skill-bundle
    name: "Impeccable complete cross-agent skill bundle"
    source_type: curl
    source_url: https://github.com/pbakaus/impeccable/releases/download/skill-v4.1.3/universal.zip
    version: "4.1.3"
    sha256: "fdcb41a24ddfb613786e3141bc7bb8466a406ffbd437a2e302f4ca70181bed9f"
    # The npm CLI and skill bundle are versioned independently. Pilot passes
    # this verified archive through IMPECCABLE_BUNDLE_PATH so the full install
    # cannot silently download a floating latest skill release.
    last_audited: "2026-09-04"

  - id: open-claude-design
    name: "Open Claude Design latest stable release channel"
    source_type: curl
    source_url: https://github.com/maxritter/open-claude-design/releases/latest/download/SHA256SUMS
    version: "live-github-release"
    sha256: "e1d7315cd9e9bb3c438951b953794b3ef4fdb5bf6e89706386bdbedb6c1ec4e4"
    soft_pin: true
    soft_pin_reason: "Max owns both projects; Pilot resolves the latest stable release and verifies its wheel against that release's SHA256SUMS"
    pin_kind: monitor
    # sha256 is an audit snapshot of the current checksum manifest. The custom
    # resolver verifies each latest wheel against the downloaded release-local
    # SHA256SUMS, so future Open Claude Design releases require no Pilot edit.
    last_audited: "2026-09-04"

  - id: agent-browser
    name: agent-browser
    source_type: npm
    source_url: agent-browser
    version: "0.36.0"
    # High-risk single-author package per PRD threat model. Manual audit on bumps.
    last_audited: "2026-09-04"

  - id: playwright-cli
    name: "@playwright/cli"
    source_type: npm
    source_url: "@playwright/cli"
    version: "0.1.19"
    last_audited: "2026-09-04"

  - id: ast-grep-npm
    name: "@ast-grep/cli fallback"
    source_type: npm
    source_url: "@ast-grep/cli"
    version: "0.45.3"
    scripts_policy: allow
    scripts_justification: "audited postinstall only links the exact platform binary already delivered by the pinned optional dependency"
    # Homebrew is preferred. This package is used only when ast-grep is absent
    # after prerequisites, including Linux/dev-container hosts without Brew.
    last_audited: "2026-09-04"

  # ---- curl-pipe installers (Task 3) ----

  - id: uv-installer
    name: astral.sh/uv/install.sh
    source_type: curl
    source_url: https://astral.sh/uv/install.sh
    version: "live-2026-09-04"
    sha256: "222e006c0fe4a0d793031833e469b21df72311f4e3526ffecca0e19e6dfabc32"
    # astral.sh does expose immutable per-version URLs, but Pilot deliberately
    # tracks the latest uv (decision 2026-06-12). The floating endpoint is
    # rewritten on every release, so the bootstrap runs it unpinned and this
    # hash is a monitoring snapshot, not an execution gate.
    soft_pin: true
    soft_pin_reason: "vendor-managed endpoint; deliberate decision to always install latest uv - script rewritten on every release"
    last_audited: "2026-09-04"

  - id: bun-installer
    name: bun.sh/install
    source_type: curl
    source_url: https://bun.sh/install
    version: "live-2026-09-04"
    sha256: "04882bf41679d49d9af108657a1e5515bf04fdf2940d12c0d0b1e5d79dc53be8"
    # Bun does not expose immutable per-version install URLs (version is
    # selected via shell arg, not URL path); soft_pin. Hash mismatch logs a
    # re-pin warning instead of failing - same drift class as GH #147.
    soft_pin: true
    soft_pin_reason: "vendor-managed endpoint; bun.sh rewrites install script on every release with no per-version URL"
    last_audited: "2026-09-04"

  - id: homebrew-installer
    name: Homebrew/install/install.sh
    source_type: curl
    # Pinned to a specific commit (HEAD/install.sh would float).
    source_url: https://raw.githubusercontent.com/Homebrew/install/c8188c1d48d77234a458b944d1d1b750f015a1c4/install.sh
    # install.sh is byte-identical to the previous commit pin (sha256 unchanged);
    # only the commit moved.
    version: "commit-c8188c1"
    commit: "c8188c1d48d77234a458b944d1d1b750f015a1c4"
    sha256: "12479a24be3f5307eecac7cde670fad7118640f031229e964f544b1367b52a41"
    last_audited: "2026-09-04"

  - id: rtk-installer
    name: rtk-ai/rtk install.sh
    source_type: curl
    source_url: https://raw.githubusercontent.com/rtk-ai/rtk/34fe2553192aef5f6ca19944cb52a272a5294c27/install.sh
    # install.sh is byte-identical to the previous commit pin (sha256 unchanged);
    # only the commit moved. `version` records the rtk release the script
    # resolves at run time (it fetches the latest release unless RTK_VERSION is set).
    version: "0.47.0"
    commit: "34fe2553192aef5f6ca19944cb52a272a5294c27"
    sha256: "d6eb73a772903e13ff34ee1be8a8b24e896ba9a978f20d2279a08b4083ea6f77"
    last_audited: "2026-09-04"

  - id: golangci-lint-installer
    name: golangci-lint install.sh
    source_type: curl
    source_url: https://raw.githubusercontent.com/golangci/golangci-lint/ed7a235d2d771152056fdc142a9855567c5796a9/install.sh
    version: "commit-ed7a235"
    commit: "ed7a235d2d771152056fdc142a9855567c5796a9"
    sha256: "1022ddb4d87ed252350ed03fc9677e250a4ae95cc6bcd4658c2a20a8a23d390f"
    last_audited: "2026-09-04"

  # ---- Homebrew formulas (Task 4) ----
  # pin_kind: monitor - homebrew/core doesn't expose stable per-version installs;
  # the manifest records the version present at audit time and lets the gate
  # check tap origin. `brew_formula` is the formula name passed to
  # `brew install`; `auto_upgrade: false` opts the formula out of routine
  # `brew upgrade` so the manifest version stays the installed version.

  - id: git-brew
    name: git
    source_type: brew
    source_url: https://github.com/git/git
    version: "2.55.0"
    pin_kind: monitor
    auto_upgrade: false
    brew_formula: git
    brew_tap: homebrew/core
    last_audited: "2026-09-04"

  - id: gh-brew
    name: GitHub CLI
    source_type: brew
    source_url: https://github.com/cli/cli
    version: "2.100.0"
    pin_kind: monitor
    auto_upgrade: false
    brew_formula: gh
    brew_tap: homebrew/core
    last_audited: "2026-09-04"

  - id: python-3-12-brew
    name: Python 3.12
    source_type: brew
    source_url: https://github.com/python/cpython
    version: "3.12.14"
    pin_kind: monitor
    auto_upgrade: false
    brew_formula: "python@3.12"
    brew_tap: homebrew/core
    last_audited: "2026-09-04"

  - id: node-22-brew
