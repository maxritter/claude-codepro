    last_audited: "2026-09-04"

  - id: nvm-brew
    name: nvm (Homebrew install path)
    source_type: brew
    source_url: https://github.com/nvm-sh/nvm
    version: "0.40.7"
    pin_kind: monitor
    auto_upgrade: false
    brew_formula: nvm
    brew_tap: homebrew/core
    last_audited: "2026-09-04"

  - id: pnpm-brew
    name: pnpm
    source_type: brew
    source_url: https://github.com/pnpm/pnpm
    version: "11.25.0"
    pin_kind: monitor
    brew_formula: pnpm
    brew_tap: homebrew/core
    last_audited: "2026-09-04"

  - id: bun-brew
    name: bun
    source_type: brew
    source_url: https://github.com/oven-sh/bun
    version: "1.4.0"
    pin_kind: monitor
    brew_formula: bun
    # bun ships from oven-sh/bun tap (Pilot pre-taps it); intentional non-core origin.
    brew_tap: oven-sh/bun
    last_audited: "2026-09-04"

  - id: uv-brew
    name: uv (Homebrew install path)
    source_type: brew
    source_url: https://github.com/astral-sh/uv
    version: "0.12.9"
    pin_kind: monitor
    brew_formula: uv
    brew_tap: homebrew/core
