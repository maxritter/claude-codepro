    source_url: https://github.com/golang/go
    version: "1.27.1"
    pin_kind: monitor
    brew_formula: go
    brew_tap: homebrew/core
    last_audited: "2026-09-04"

  - id: gopls-brew
    name: gopls
    source_type: brew
    source_url: https://github.com/golang/tools
    version: "0.23.0"
    pin_kind: monitor
    brew_formula: gopls
    brew_tap: homebrew/core
    last_audited: "2026-09-04"

  - id: jq-brew
    name: jq
    source_type: brew
    source_url: https://github.com/jqlang/jq
    version: "1.8.2"
    pin_kind: monitor
    brew_formula: jq
    brew_tap: homebrew/core
    last_audited: "2026-09-04"

  - id: ripgrep-brew
    name: ripgrep
    source_type: brew
    source_url: https://github.com/BurntSushi/ripgrep
    version: "15.2.0"
    pin_kind: monitor
    brew_formula: ripgrep
    brew_tap: homebrew/core
    last_audited: "2026-09-04"

  - id: rtk-brew
    name: rtk (Homebrew install path)
    source_type: brew
    source_url: https://github.com/rtk-ai/rtk
    version: "0.47.0"
    pin_kind: monitor
    brew_formula: rtk
    brew_tap: homebrew/core
    last_audited: "2026-09-04"

  - id: ast-grep-brew
    name: ast-grep
    source_type: brew
    source_url: https://github.com/ast-grep/ast-grep
    version: "0.45.3"
    pin_kind: monitor
    brew_formula: ast-grep
    brew_tap: homebrew/core
