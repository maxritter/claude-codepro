  # ---- npx-launched MCP servers (Task 5) ----
  # Every entry MUST also be referenced from .mcp.json or pilot/.mcp.json
  # with `args: ["-y", "<source_url>@<version>"]`. Drift checker enforces this.

  - id: context7-mcp
    name: "@upstash/context7-mcp"
    source_type: npm
    source_url: "@upstash/context7-mcp"
    version: "4.0.4"
    # 4.0.0 (2026-08-07) is a major bump; verified 2026-08-10 that the stdio
    # MCP contract is unchanged - same npx invocation, same protocol version,
    # same tool surface (resolve-library-id, query-docs). The major reflects an
    # internal move to the @modelcontextprotocol/{node,server} SDK packages.
    last_audited: "2026-09-04"

  - id: open-websearch
    name: open-websearch
    source_type: npm
    source_url: open-websearch
    version: "2.1.11"
    # No public source repo declared in npm registry; manual audit only.
    last_audited: "2026-09-04"

  - id: fetcher-mcp
    name: fetcher-mcp
    source_type: npm
    source_url: fetcher-mcp
    version: "0.3.9"
    # No public source repo declared in npm registry; manual audit only.
    last_audited: "2026-09-04"

  - id: zod
    name: zod
    source_type: npm
    source_url: zod
    version: "4.5.4"
    # Peer dep auto-installed into open-websearch's npx cache when missing
    # (see _fix_npx_peer_dependencies in installer/steps/dependencies.py).
    last_audited: "2026-09-04"

  # ---- uv tool installs ----
  # Installed with `uv tool install`, not the PyPI bootstrap group below: these
  # resolve after the manifest is readable, so the version comes from here.

  - id: semble
    name: semble (code search)
    source_type: pypi
    source_url: https://github.com/MinishLab/semble
    version: "0.5.5"
    # MIT. Installed with the [mcp] extra at an exact pin; pilot/.mcp.json
    # launches the Pilot-installed ~/.pilot/bin/semble symlink directly, so MCP
    # startup cannot resolve a different release or inherit ambient uv indexes.
    last_audited: "2026-09-04"

  # ---- PyPI bootstrap (Task 7) ----
  # Used by install.sh and launcher/build.py via `uv run --no-project --with`.
  # These run BEFORE the installer can read the manifest, so install.sh and
  # launcher/build.py read the version literals directly. CI cross-checks via
  # scripts/check_manifest_drift.py.

  - id: rich
    name: rich
    source_type: pypi
    source_url: https://github.com/Textualize/rich
    version: "15.0.0"
    last_audited: "2026-09-04"

  - id: certifi
    name: certifi
    source_type: pypi
    source_url: https://github.com/certifi/python-certifi
    version: "2026.7.22"
    last_audited: "2026-09-04"

  - id: cryptography
    name: cryptography
    source_type: pypi
    source_url: https://github.com/pyca/cryptography
    version: "48.0.1"
    # 49.x/50.x no longer publish Intel macOS wheels. Keep the newest release
    # with both x86_64 and arm64 wheels for Pilot's four native targets.
    last_audited: "2026-09-04"

  - id: pyyaml
    name: PyYAML
    source_type: pypi
    source_url: https://github.com/yaml/pyyaml
    version: "6.0.3"
    last_audited: "2026-09-04"
